<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصر مليانة ألواح شمسية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101820; color: white; font-family: Arial; }
        header { text-align: center; padding: 16px; }
        h2 { color: #ffcc00; margin: 0 0 6px; }
        a { color: #ffcc00; }
        .info { text-align: center; background: #1c2b36; padding: 14px; }
        .number { font-size: 35px; font-weight: bold; color: #ffcc00; margin: 6px; }
        .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; background: #16222c; padding: 10px; }
        .controls label { font-size: 14px; }
        select { font-size: 14px; padding: 2px 6px; }
        #map { width: 100%; height: 70vh; }
        .compare { margin-top: 6px; font-size: 16px; }
        footer { padding: 14px 20px; font-size: 12px; color: #aab; line-height: 1.7; }
        path.panels { fill: url(#panelPattern); fill-opacity: 1; }
    </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <defs>
        <pattern id="panelPattern" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#12335c"/>
            <rect x="0.5" y="0.5" width="7" height="7" fill="#1d5391"/>
            <path d="M4 0.5V7.5M0.5 4H7.5" stroke="#9fc4ee" stroke-width="0.6"/>
        </pattern>
    </defs>
</svg>

<header>
    <h2>☀️ <span id="title">مصر</span> مليانة ألواح شمسية</h2>
    <div>كل الأرض المناسبة حسب بيانات مفتوحة</div>
</header>

<div class="info">
    مساحة الأرض الصالحة (حسب الاختيار)
    <div class="number"><span id="area">…</span> كم²</div>
    <span id="pct"></span>
    <div class="compare" id="compare"></div>
</div>

<div class="controls">
    <label>الدولة: <select id="country"><option value="egypt" selected>مصر</option><option value="libya">ليبيا</option></select></label>
    <label>أقصى انحدار:
        <select id="slope"><option value="1">3°</option><option value="2" selected>5°</option><option value="3">10°</option></select>
    </label>
    <label>الوصول (طريق أو خط كهرباء):
        <select id="access"><option value="3" selected>الكل</option><option value="2">≤ 25 كم</option><option value="1">≤ 10 كم</option></select>
    </label>
    <label><input type="checkbox" id="sq"> المربع القديم 306×306 كم</label>
    <label><input type="checkbox" id="pv"> نقط الإشعاع (PVGIS)</label>
</div>

<div id="map"></div>

<footer id="foot"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/suitable_egypt.js"></script>
<script src="data/stats.js"></script>
<script src="data/pvgis_egypt.js"></script>
<script>
    const fmt = n => Number(n).toLocaleString("en-US");
    const map = L.map("map").setView([26.8, 30.8], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);

    let CC = "egypt";
    const SL = { 1: 3, 2: 5, 3: 10 }, AC = { 1: 10, 2: 25, 3: null };
    let layer = null;

    function statFor(s, a) {
        return (CC === "egypt" ? SOLAR_STATS : SOLAR_STATS.libya).classes.find(c => c.slope_max_deg === SL[s] && c.access_max_km === AC[a]);
    }

    function redraw() {
        const s = +document.getElementById("slope").value, a = +document.getElementById("access").value;
        if (layer) map.removeLayer(layer);
        layer = L.geoJSON(CC === "egypt" ? SUITABLE_EGYPT : SUITABLE_LIBYA, {
            filter: f => f.properties.s <= s && f.properties.a <= a,
            style: { className: "panels", color: "#ffcc00", weight: 0, stroke: false, fillOpacity: 1 },
            onEachFeature: (f, l) => l.bindPopup(
                "<b>أرض صالحة للألواح</b><br>فئة الانحدار: ≤ " + SL[f.properties.s] + "°<br>فئة الوصول: " +
                (AC[f.properties.a] ? "≤ " + AC[f.properties.a] + " كم" : "أبعد من 25 كم") +
                "<br><small>العتبات افتراضات (غير موثق). الشكل مبسّط، والمساحات من شبكة 250 م.</small>")
        }).addTo(map);
        const st = statFor(s, a);
        document.getElementById("area").textContent = fmt(st.area_km2);
        const S = CC === "egypt" ? SOLAR_STATS : SOLAR_STATS.libya;
        document.getElementById("pct").textContent = "= " + st["pct_of_" + CC] + "% من مساحة " + (CC === "egypt" ? "مصر" : "ليبيا") + " (" + fmt(S[CC + "_reference_area_km2"]) + " كم²، Natural Earth)";
        const share = (93500 / st.area_km2 * 100).toFixed(1);
        document.getElementById("compare").textContent = "93,500 كم² (غير موثق) = " + share + "% من الأرض الصالحة في " + (CC === "egypt" ? "مصر" : "ليبيا") + " حسب هذا الاختيار";
    }
    document.getElementById("country").onchange = e => {
        CC = e.target.value; document.getElementById("title").textContent = CC === "egypt" ? "مصر" : "ليبيا";
        const go = () => { map.setView(CC === "egypt" ? [26.8, 30.8] : [27, 17.5], 6); redraw(); };
        if (CC === "libya" && typeof SUITABLE_LIBYA === "undefined") { const sc = document.createElement("script"); sc.src = "data/suitable_libya.js"; sc.onload = go; document.body.appendChild(sc); } else go();
    };
    document.getElementById("slope").onchange = redraw;
    document.getElementById("access").onchange = redraw;

    // المربع القديم (الكوميت e9bf43a)
    const sqBounds = [[23.62, 23.48], [26.38, 26.52]];
    const sqLayer = L.rectangle(sqBounds, { color: "#ff5533", weight: 2, fillOpacity: 0.15 }).bindPopup("المربع المرجعي 306 × 306 كم (93,500 كم²، غير موثق)");
    document.getElementById("sq").onchange = e => e.target.checked ? sqLayer.addTo(map) : map.removeLayer(sqLayer);

    // نقط PVGIS
    const pvLayer = L.layerGroup(PVGIS_EGYPT.points.map(p => L.circleMarker([p.lat, p.lon], { radius: 5, color: "#fff", weight: 1, fillColor: "#ffcc00", fillOpacity: 0.9 })
        .bindPopup("PVGIS: " + fmt(p.E_y) + " كيلوواط·ساعة/كيلوواط ذروة/سنة<br>إشعاع مائل: " + fmt(p.H_y) + " كيلوواط·ساعة/م²/سنة<br><small>" + PVGIS_EGYPT.settings + "</small>")));
    document.getElementById("pv").onchange = e => e.target.checked ? pvLayer.addTo(map) : map.removeLayer(pvLayer);

    redraw();
    document.getElementById("foot").innerHTML =
        "المصادر: " + SOLAR_STATS.sources.map(s => '<a href="' + s.url + '">' + s.name + "</a>").join(" · ") +
        ' · <a href="' + PVGIS_EGYPT.url + '">PVGIS v5.3 (SARAH3)</a>. ' +
        "تاريخ المعالجة: " + SOLAR_STATS.generated + ". العتبات (غطاء الأرض ≥50%، الانحدار 3/5/10°، الوصول 10/25 كم، التبسيط) افتراضات غير موثقة. " +
        "لا يوجد في البيانات ملكية أراض ولا سعة شبكة الكهرباء، والكثبان تقريبية (رمال OSM فقط).";
</script>
</body>
</html>
